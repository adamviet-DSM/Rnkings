<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Iowa Youth Basketball Tournaments{% endblock %}</title>
  <meta name="description" content="{% block description %}Find Iowa youth basketball tournaments for grades 3–8 by location, grade, date and fee.{% endblock %}" />
  <style>
    :root {
      --charcoal: #2B2E33; --charcoal-2: #3A3E44; --gold: #D4AF4F; --gold-soft: #FAF5E8;
      --gold-dark: #7A6120; --page: #F7F5F0; --card: #fff; --text: #1F2328;
      --muted: #5F6670; --line: #E4E0D6; --good: #1F7A4D; --bad: #A23B2A;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--page); color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    a { color: inherit; }
    header { background: linear-gradient(135deg, var(--charcoal), var(--charcoal-2));
      border-bottom: 4px solid var(--gold); color: #fff; }
    .bar { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex;
      align-items: center; gap: 12px; flex-wrap: wrap; }
    .brand { font-weight: 900; font-size: 18px; text-decoration: none; margin-right: auto; }
    nav a { color: #D9DCE0; text-decoration: none; font-weight: 600; font-size: 15px;
      padding: 6px 10px; border-radius: 8px; }
    nav a.on { background: var(--gold); color: var(--charcoal); }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    footer { max-width: 760px; margin: 0 auto; padding: 24px 16px; color: var(--muted);
      font-size: 13px; }
    .btn { display: inline-block; background: var(--gold); color: var(--charcoal);
      font-weight: 700; text-decoration: none; border: 0; border-radius: 10px;
      padding: 10px 16px; font-size: 15px; cursor: pointer; }
    .btn.ghost { background: #fff; border: 1px solid var(--line); color: var(--text); }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="/tournaments">🏀 Iowa Youth Basketball</a>
      <nav>
        <a href="/tournaments" class="{{ 'on' if nav == 'tournaments' }}">Tournaments</a>
        <a href="/rankings" class="{{ 'on' if nav == 'rankings' }}">Rankings</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    Facts only: dates, places, grades and fees, with a link to each tournament's own page.
    Always confirm details with the organizer before registering.
  </footer>
</body>
</html>
